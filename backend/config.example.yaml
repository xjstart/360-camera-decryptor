# 360智能摄像机配置文件
# 如果 backend/data/config.yaml 不存在，服务启动时会自动用本模板生成

# 认证配置
# 只需要从浏览器 Cookie 中分别填入这三个值
cookie:
  - Q: ""
  - T: ""
  - jia_web_sid: ""

# 摄像机列表
cameras:
  - enabled: true
    name: "摄像机1"
    sn: "xxxxxxxx"
    # API 版本: v1 或 v2，默认 v2
    api_version: "v2"

  - name: "摄像机2"
    sn: "xxxxxxxx"
    enabled: true
    api_version: "v1"

# 请求配置
# 每个摄像机请求之间的间隔（秒）
request_interval: 3

# 后端服务配置
server:
  # 播放信息缓存秒数，避免前端获取到的密钥和代理流地址错位
  play_info_cache_seconds: 30
  # 播放信息本地持久化目录；留空时默认使用 backend/data/play_info_cache
  play_info_cache_dir: ""
  # MP4 录像分片默认保存目录；留空时使用 backend/data/recordings，网页可为当前录像覆盖
  recording_dir: ""
  # 播放与录像共用一套拉流、WASM 解密和 H.264/AAC 编码主干
  share_decrypt_session_between_playback_and_recording: true
  # 共享模式下录像等待写入 ffmpeg 的 MPEG-TS 缓存上限
  recording_max_pending_input_bytes: 16777216
  # 部署在反向代理后面时，显式指定前端可访问的后端公网地址
  # 例如: "https://you.domain.com"
  public_base_url: ""
  # Node 拉取上游流时的单次读取块大小；更小的值通常更省内存，但 CPU 开销会略高
  decrypt_network_chunk_size: 65536
  # Node 侧待送入解码器的输入缓存上限，超过后会暂停继续拉取上游
  decrypt_max_pending_input_bytes: 524288
  # Node -> ffmpeg 的视频待写入缓存上限，超过后会触发背压/丢帧保护
  decrypt_max_pending_video_bytes: 12582912
  # Node -> ffmpeg 的音频待写入缓存上限
  decrypt_max_pending_audio_bytes: 1048576
  # ffmpeg 编码线程数，内存紧张时建议保持 1
  decrypt_ffmpeg_threads: 1
  # 没有观众后继续保留解密进程的秒数，避免播放器短时间重连时频繁拉起新进程
  decrypt_idle_timeout_seconds: 10
